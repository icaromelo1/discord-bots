services:
  dj:
    build:
      # contexto é a raiz do monorepo: o build precisa dos manifestos do workspace
      # e de packages/shared, que vivem fora de apps/dj
      context: .
      dockerfile: apps/dj/Dockerfile
    image: discord-bots-dj:latest
    container_name: discord-dj
    restart: unless-stopped
    env_file: apps/dj/.env
    volumes:
      - ./apps/dj/music-cache:/app/music-cache
      # rw de propósito: o rclone reescreve o token OAuth renovado neste arquivo.
      # Montado :ro ele funciona até o token rotacionar e então falha calado.
      - /home/ubuntu/.config/rclone:/home/node/.config/rclone
      # DIRETÓRIO, nunca o arquivo: bind-mount de arquivo único quebra quando o cron
      # de cookies reescreve e troca o inode
      - /home/ubuntu/projects/kairos-api/cookies:/app/cookies:ro
    networks:
      - data

  icarus:
    build:
      context: .
      dockerfile: apps/icarus/Dockerfile
    image: discord-bots-icarus:latest
    container_name: icarus
    restart: unless-stopped
    env_file: apps/icarus/.env
    volumes:
      - ./apps/icarus/music-cache:/app/music-cache
      - ./apps/icarus/conhecimento:/app/conhecimento:ro
      - /home/ubuntu/.config/rclone:/home/node/.config/rclone
      - /home/ubuntu/projects/kairos-api/cookies:/app/cookies:ro
    networks:
      - data

  gm:
    build:
      context: .
      dockerfile: apps/gm/Dockerfile
    image: discord-bots-gm:latest
    container_name: mc-discord-bot
    restart: unless-stopped
    env_file: apps/gm/.env
    volumes:
      # diretório, não o arquivo: o Minecraft rotaciona latest.log e troca o inode
      - /home/ubuntu/projects/minecraft/data/logs:/app/logs:ro
      - /home/ubuntu/projects/minecraft/data/world/playerdata:/app/playerdata:ro
    networks:
      - minecraft_default


networks:
  data:
    external: true
  minecraft_default:
    external: true
